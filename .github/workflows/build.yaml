name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  # Detect whether anything outside docs changed. Keep the build jobs present
  # on documentation-only changes and condition their steps so required checks
  # conclude successfully rather than being skipped at the job level.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  py-ruff:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
      - name: Lint with Ruff
        uses: chartboost/ruff-action@v1
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
      - name: Format with Ruff
        uses: chartboost/ruff-action@v1
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        with:
          args: "format --check"

  py-mypy:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip dependencies
        uses: actions/cache@v3
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Run mypy
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        run: |
          mypy --python-executable $(which python)

  py-test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip dependencies
        uses: actions/cache@v3
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Run tests
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        run: pytest

  py-build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build package
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        run: python -m build
      - name: Verify package
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
        run: |
          python -m pip install dist/*.whl
          python -c "import inspect_swe; print('Package imported successfully')"
