[build-system]
# Cap hatchling <1.30: 1.30.0 emits core metadata 2.5 (PEP 794), which PyPI
# does not yet accept (https://github.com/pypi/warehouse/issues/19083).
# Relax once warehouse supports metadata 2.5.
requires = ["hatchling<1.30", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "inspect_swe"
dynamic = ["version"]
description = "Software engineering agents for Inspect AI."
authors = [{ name = "Meridian Labs" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
dependencies = [
    "httpx",
    # >=0.3.264 is the first upstream release exporting every symbol imported at
    # module scope (ModelResolver arrived after 0.3.255); the .dev0 form keeps the
    # trajectory-labs inspect_ai fork admitted -- its builds version as the NEXT
    # upstream release's dev pre-release (e.g. 0.3.264.dev201+upstream.g8984b671d),
    # which a plain >=0.3.264 would reject.
    "inspect_ai>=0.3.264.dev0",
    "nest_asyncio",
    "platformdirs",
    "pydantic>=2.13.0",
    "pyyaml",
    "sniffio",
    "anyio",
    "typing_extensions>=4.9.0",
    "agent-client-protocol>=0.11.0",
]

[project.urls]
Documentation = "https://meridianlabs-ai.github.io/inspect_swe/"
"Source Code" = "https://github.com/meridianlabs-ai/inspect_swe"
"Issue Tracker" = "https://github.com/meridianlabs-ai/inspect_swe/issues"

[project.entry-points.inspect_ai]
inspect_swe = "inspect_swe._registry"


[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "anthropic",
    "openai",
    "pytest-dotenv",
    "types-PyYAML",
    "IPython",
    "inspect-evals",
    "inspect_k8s_sandbox",
    "mini-swe-agent",
    "inspect_swe[doc]",
]
doc = [
    "quarto-cli>=1.9.36",
    "griffe>=2",
    "panflute",
    "markdown",
    "rich",
]

[tool.hatch.build]
only-packages = true
exclude = ["docs/", "tests/"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/inspect_swe/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version" # Important for PyPI compatibility

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
extend-exclude = ["docs"]
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # flake8
    "D",      # pydocstyle
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
    # "RET", # flake8-return
    # "RUF", # ruff rules
]
ignore = ["E203", "E501", "D10", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
# Root-only by construction (PEP 735 groups never enter published metadata).
# NOT a tool.uv.sources entry: uv applies a git dependency's sources to that
# dependency's consumers, which would hand every project installing this fork a
# second inspect-ai URL and the "conflicting URLs for package inspect-ai"
# resolution failure the moment the inspect_ai fork release moves. This group
# only pairs the dev venv (uv sync installs it by default) with the fork
# inspect_ai the runtime surface (bridge kwargs, human_cli extensions) is written
# against, so make check and pytest exercise the shipped pairing. The import-time
# surface tolerates upstream inspect-ai independently (_util/inspect_compat.py).
# Move the rev deliberately with the inspect_ai fork release; never a branch name.
dev = [
    "inspect-ai @ git+https://github.com/trajectory-labs-pbc/inspect_ai.git@8984b671da647ef278fe9bd86c3633c664773d6d",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
python_executable = ".venv/bin/python"

# google-antigravity is a sandbox-only runtime dependency (the SDK runs inside the
# Inspect sandbox, not on the host), so it is intentionally not a project dependency
# and ships no py.typed marker. sdk_runner.py imports it only in-sandbox; tell mypy
# not to require types for it on the host.
[[tool.mypy.overrides]]
module = ["google.antigravity.*"]
ignore_missing_imports = true

# inspect_cyber is only used by examples/ (guarded by a try/except with install
# instructions) and is not a project dependency; tell mypy not to require types
# for it when checking examples on the host.
[[tool.mypy.overrides]]
module = ["inspect_cyber.*"]
ignore_missing_imports = true
